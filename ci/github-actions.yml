name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e '.[dev]'
      - run: python -m pytest
      - run: node --test tests/*.cjs
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag swarmboard:test .
      - name: Check installed runtime
        run: docker run --rm --entrypoint codex swarmboard:test --version
      - name: Exercise hosted startup
        run: python3 scripts/container_smoke.py
