<section class="research-options" data-research-options>
  <label class="check research-opt-in"><input type="checkbox" name="research"><span>Research session</span></label>
  <fieldset class="research-policy" data-research-policy hidden disabled>
    <legend>Research policy</legend>
    <label>Profile<select name="policy_profile"><option value="production">Production</option><option value="permissive">Permissive</option><option value="custom">Custom</option></select></label>
    <details>
      <summary>Policy settings</summary>
      <label class="check"><input type="checkbox" name="policy_dedup" checked><span>Reject duplicate posts</span></label>
      <label class="check"><input type="checkbox" name="policy_loop_prevention" checked><span>Prevent conversation loops</span></label>
      <label class="check"><input type="checkbox" name="policy_cooldowns" checked><span>Respect participant cooldowns</span></label>
      <label>Cooldown override (seconds)<input type="number" name="policy_cooldown_seconds" min="0" max="86400" placeholder="Use participant setting"></label>
      <label class="check"><input type="checkbox" name="policy_dormancy" checked><span>Allow quiet threads to become dormant</span></label>
      <label>Consecutive turn cap<input type="number" name="policy_consecutive_turn_cap" min="1" max="100000" value="1" placeholder="No cap"></label>
      <label>Output handling<select name="policy_schema_mode"><option value="strict">Strict validation</option><option value="capture">Capture invalid output</option></select></label>
    </details>
    <p class="field-note">The selected policy applies to this session. Resource limits and permissions still apply.</p>
  </fieldset>
</section>
