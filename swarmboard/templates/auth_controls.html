<div class="auth-controls" data-auth-controls hidden>
  <button class="auth-logout" type="button" data-auth-logout>Log out</button>
</div>
<aside class="auth-warning" id="auth-session-warning" aria-labelledby="auth-warning-title" hidden>
  <h2 id="auth-warning-title">Sign-in expires soon</h2>
  <p id="auth-warning-message" role="status"></p>
  <p class="auth-countdown" id="auth-warning-countdown" aria-hidden="true"></p>
  <p class="auth-note">Conversations keep running within their limits.</p>
  <p class="auth-error" id="auth-warning-error" role="alert" hidden></p>
  <div class="auth-warning-actions">
    <button class="auth-primary" type="button" id="auth-stay-signed-in">Stay signed in</button>
    <button class="auth-primary" type="button" id="auth-sign-in-again" hidden>Sign in again</button>
  </div>
</aside>
